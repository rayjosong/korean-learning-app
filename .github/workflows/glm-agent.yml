name: GLM issue worker

on:
  issue_comment:
    types: [created]

env:
  OPENCODE_VERSION: "1.18.14"

jobs:
  glm:
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/glm') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Select GLM model
        id: model
        shell: bash
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          requested="$(printf '%s\n' "$COMMENT" | head -n1 | awk '{print $2}')"
          model="${requested:-glm-5.3}"

          case "$model" in
            glm-5.3|glm-5.2|glm-5-turbo|glm-4.7|glm-4.5-air)
              ;;
            *)
              echo "Unsupported model: $model"
              echo "Supported: glm-5.3, glm-5.2, glm-5-turbo, glm-4.7, glm-4.5-air"
              exit 1
              ;;
          esac

          echo "model=$model" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity for OpenCode
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Git author: $(git config user.name) <$(git config user.email)>"

      - name: Install pinned OpenCode
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash -s -- --version "$OPENCODE_VERSION"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Show OpenCode run configuration
        shell: bash
        env:
          SELECTED_MODEL: ${{ steps.model.outputs.model }}
        run: |
          set -euo pipefail
          echo "OpenCode version: $("$HOME/.opencode/bin/opencode" --version)"
          echo "OpenCode model: zai-coding-plan/$SELECTED_MODEL"
          echo "Issue: #${{ github.event.issue.number }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Commit: ${{ github.sha }}"

      - name: Run OpenCode with selected GLM model
        shell: bash
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: zai-coding-plan/${{ steps.model.outputs.model }}
          MENTIONS: /glm
          USE_GITHUB_TOKEN: "true"
          PROMPT: |
            Implement GitHub issue #${{ github.event.issue.number }}.

            Before making any changes, read and obey AGENTS.md, then read docs/PRODUCT.md,
            docs/ARCHITECTURE.md, and docs/BACKLOG.md in that order.

            Treat the issue body and its acceptance criteria as the assigned task. Do not implement
            unrelated backlog items. Follow the repository branch, verification, backlog-update,
            and end-of-task-report rules in AGENTS.md exactly.

            The selected model for this run is ${{ steps.model.outputs.model }}.
            The command comment that started this run was:
            ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          echo "Starting OpenCode GitHub agent with DEBUG logs enabled"
          opencode --print-logs --log-level DEBUG github run

      - name: Push agent work and open pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          current_branch="$(git branch --show-current)"
          requested_branch="$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/.*Use `\([^`]*\)`.*/\1/p' | head -n1)"

          if [[ "$current_branch" == agent/* ]]; then
            branch="$current_branch"
          elif [[ "$requested_branch" == agent/* ]]; then
            branch="$requested_branch"
            git switch -C "$branch"
          else
            branch="agent/issue-${ISSUE_NUMBER}"
            git switch -C "$branch"
          fi

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: implement issue #${ISSUE_NUMBER}"
          fi

          if git diff --quiet "origin/main...HEAD"; then
            echo "No changes relative to main; nothing to publish."
            exit 1
          fi

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "$branch"

          existing_pr="$(gh pr list --head "$branch" --base main --state open --json url --jq '.[0].url // empty')"
          if [[ -n "$existing_pr" ]]; then
            echo "Pull request already exists: $existing_pr"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$branch" \
            --title "${ISSUE_TITLE}" \
            --body "Closes #${ISSUE_NUMBER}.\n\nImplemented by the GLM issue worker. See the branch commits and CI checks for verification details."

      - name: Show OpenCode diagnostic log tail
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log_dir="$HOME/.local/share/opencode/log"

          if [[ ! -d "$log_dir" ]]; then
            echo "No OpenCode log directory found at $log_dir"
            exit 0
          fi

          latest_log="$(find "$log_dir" -maxdepth 1 -type f -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          if [[ -z "$latest_log" ]]; then
            echo "No OpenCode log files found in $log_dir"
            exit 0
          fi

          echo "::group::OpenCode diagnostic log tail: $(basename "$latest_log")"
          tail -n 500 "$latest_log"
          echo "::endgroup::"
