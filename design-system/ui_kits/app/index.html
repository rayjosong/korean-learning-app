<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Korean Reading Room · Applied Kit</title><link rel="stylesheet" href="../../colors_and_type.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--font-body)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.rail{padding:28px 20px;border-right:1px solid var(--border)}.brand{font-size:18px;font-weight:680;letter-spacing:-.03em}.brand span{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:9px;border:1px solid var(--fg)}.nav{display:grid;gap:3px;margin-top:46px}.nav button{min-height:44px;border:0;border-radius:var(--radius-nav);background:none;text-align:left;padding:0 10px;color:var(--muted)}.nav button:hover{background:var(--surface);color:var(--fg)}.nav button.active{background:var(--fg);color:var(--surface);font-weight:650}main{max-width:1060px;width:100%;margin:auto;padding:56px 48px}.eyebrow{margin:0;color:var(--accent-deep);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.title{font:620 clamp(40px,5vw,62px)/1.08 var(--font-display);letter-spacing:-.05em;margin:10px 0 14px;max-width:13ch}.intro{color:var(--muted);font-size:17px;max-width:52ch;margin:0}.desk{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:42px;margin-top:44px}.source{background:var(--fg);color:var(--surface);aspect-ratio:16/8;display:grid;place-items:center;position:relative}.play{width:62px;height:62px;border:1px solid oklch(100% 0 0/.55);border-radius:50%;background:transparent;color:var(--surface);font-size:20px}.play:hover{background:var(--surface);color:var(--fg)}.time{position:absolute;bottom:18px;left:20px;right:20px;height:3px;background:oklch(100% 0 0/.3)}.time:before{content:'';display:block;width:53%;height:100%;background:var(--accent)}.transcript{border-top:1px solid var(--border);margin-top:26px}.segment{display:grid;grid-template-columns:55px 1fr;gap:14px;width:100%;border:0;border-bottom:1px solid var(--border);background:none;text-align:left;padding:15px 0}.segment:hover{background:var(--surface)}.segment.active{box-shadow:inset 3px 0 var(--accent);padding-left:14px;background:var(--accent-wash)}time{font:11px var(--font-mono);color:var(--muted);padding-top:6px}.segment b{font-size:19px;font-weight:590}.segment small{display:block;color:var(--muted);margin-top:3px}.drawer{align-self:start;background:var(--surface);padding:25px;box-shadow:var(--shadow)}.drawer h2{font-size:26px;line-height:1.4;margin:16px 0 3px}.translation{color:var(--muted);margin:0 0 22px}.word{display:grid;grid-template-columns:105px 1fr;gap:11px;padding:10px 0;border-bottom:1px solid var(--border)}.word span{color:var(--muted)}.primary{border:0;border-radius:var(--radius-control);min-height:46px;padding:0 16px;background:var(--accent-deep);color:var(--surface);font-weight:670}.primary:hover{background:var(--accent);transform:translateY(-1px)}.secondary{border:1px solid var(--border);border-radius:var(--radius-control);min-height:44px;padding:0 14px;background:transparent;margin-left:7px}.secondary:hover{border-color:var(--fg);background:var(--surface)}.toast{min-height:20px;margin:12px 0 0;color:var(--sage);font-size:13px}@media(max-width:800px){.app{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid var(--border);padding:18px 20px}.nav{display:flex;overflow:auto;margin-top:16px}.nav button{white-space:nowrap}.desk{grid-template-columns:1fr;gap:30px}main{padding:34px 22px 54px}}
</style></head><body><div class="app" data-od-id="applied-kit"><aside class="rail" data-od-id="kit-global-navigation"><div class="brand"><span>ㄱ</span>Korean Reading Room</div><nav class="nav"><button class="active">Today</button><button>Reading desk</button><button>Library</button><button>Review</button></nav></aside><main><p class="eyebrow">Reading desk</p><h1 class="title">Keep the sentence near its source.</h1><p class="intro">A compact applied interface that demonstrates the system’s learning flow.</p><section class="desk" data-od-id="kit-reading-desk"><div><section class="source" data-od-id="kit-source-player"><button class="play" aria-label="Play source clip">▶</button><div class="time"></div></section><div class="transcript" data-od-id="kit-transcript-list"><button class="segment"><time>12:38</time><span><b lang="ko">오늘 진짜 날씨가 좋네요.</b><small>Today, the weather is really nice.</small></span></button><button class="segment active"><time>12:43</time><span><b lang="ko">그래서 그냥 걸어가려고요.</b><small>So I’m just going to walk there.</small></span></button><button class="segment"><time>12:49</time><span><b lang="ko">근데 생각보다 멀어요.</b><small>But it’s farther than I thought.</small></span></button></div></div><aside class="drawer" data-od-id="kit-phrase-drawer"><p class="eyebrow">Current sentence</p><h2 lang="ko" id="sentence">그래서 그냥 걸어가려고요.</h2><p class="translation" id="meaning">So I’m just going to walk there.</p><div class="word"><strong lang="ko">그래서</strong><span>so / therefore</span></div><div class="word"><strong lang="ko">그냥</strong><span>just / simply</span></div><div class="word"><strong lang="ko">걸어가려고요</strong><span>planning to walk there</span></div><p><button class="primary" id="save">Add to review</button><button class="secondary">I know this</button></p><p class="toast" id="toast" aria-live="polite"></p></aside></section></main></div><script>document.querySelectorAll('.segment').forEach(x=>x.addEventListener('click',()=>{document.querySelectorAll('.segment').forEach(y=>y.classList.remove('active'));x.classList.add('active');document.getElementById('sentence').textContent=x.querySelector('b').textContent;document.getElementById('meaning').textContent=x.querySelector('small').textContent}));document.getElementById('save').addEventListener('click',()=>document.getElementById('toast').textContent='Saved for your next review.');document.querySelector('.play').addEventListener('click',e=>{e.currentTarget.textContent=e.currentTarget.textContent==='▶'?'❚❚':'▶'})</script></body></html>
