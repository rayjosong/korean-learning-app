<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;background:var(--bg);font:15px/1.55 var(--font-body);color:var(--fg)}main{max-width:920px;margin:auto;padding:42px}.sheet{background:var(--surface);box-shadow:var(--shadow);padding:30px}.eyebrow{color:var(--accent-deep);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}.scale{height:120px;display:flex;align-items:end;gap:14px;border-bottom:1px solid var(--border)}i{display:block;height:18px;background:var(--accent)}.a{width:4px}.b{width:8px}.c{width:12px}.d{width:16px}.e{width:24px}.f{width:32px}.g{width:48px}.h{width:56px}.labels{font:12px var(--font-mono);word-spacing:17px}.rule{border-top:1px solid var(--border);margin-top:28px;padding-top:18px}</style></head><body><main data-od-id="spacing-preview"><p class="eyebrow">Focused preview · spacing</p><h1>Four pixels, deliberately paced.</h1><section class="sheet"><h2>Spacing scale</h2><div class="scale"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><i class="e"></i><i class="f"></i><i class="g"></i><i class="h"></i></div><p class="labels">4 8 12 16 24 32 48 56</p><div class="rule"><strong>Layout application</strong><p>Use small steps within rows, 24–32px between related blocks, and 48–56px for page rhythm. Desktop content keeps a 48px gutter; compact screens use 22px.</p></div></section></main></body></html>
