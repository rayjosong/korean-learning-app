<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;background:var(--bg);font:15px/1.55 var(--font-body);color:var(--fg)}main{max-width:920px;margin:auto;padding:42px}.sheet{background:var(--surface);box-shadow:var(--shadow);padding:30px}.eyebrow{color:var(--accent-deep);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}button{font:650 14px var(--font-body);cursor:pointer}.primary{min-height:46px;border:0;border-radius:6px;padding:0 17px;background:var(--accent-deep);color:white}.secondary{min-height:44px;margin-left:8px;border:1px solid var(--border);border-radius:6px;padding:0 15px;background:transparent}.segment{display:grid;grid-template-columns:55px 1fr;gap:14px;width:100%;margin-top:28px;padding:15px;border:0;box-shadow:inset 3px 0 var(--accent);background:var(--accent-wash);text-align:left}.segment small{display:block;color:var(--muted)}</style></head><body><main data-od-id="components-preview"><p class="eyebrow">Focused preview · components</p><h1>One clear action per moment.</h1><section class="sheet"><h2>Phrase action group</h2><button class="primary">Add to review</button><button class="secondary">I know this</button><h2>Selected transcript row</h2><button class="segment"><time>12:43</time><span lang="ko"><b>그래서 그냥 걸어가려고요.</b><small>So I’m just going to walk there.</small></span></button><p>The inset persimmon rule joins the selected sentence to its phrase detail without overwhelming the transcript.</p></section></main></body></html>
