<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;background:var(--bg);font:15px/1.55 var(--font-body);color:var(--fg)}main{max-width:920px;margin:auto;padding:42px}.sheet{background:var(--surface);box-shadow:var(--shadow);padding:30px}.eyebrow{color:var(--accent-deep);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.box{height:120px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center}.control{border-radius:6px}.nav{border-radius:7px}.drawer{border-radius:7px;box-shadow:var(--shadow)}.note{color:var(--muted)}</style></head><body><main data-od-id="elevation-preview"><p class="eyebrow">Focused preview · shape</p><h1>Hairlines do the organising.</h1><section class="sheet"><div class="row"><div><div class="box">Sheet</div><p class="note">square editorial plane</p></div><div><div class="box control">Control</div><p class="note">6px radius</p></div><div><div class="box drawer">Drawer</div><p class="note">7px + quiet shadow</p></div></div><hr><p>Use elevation only when a phrase drawer or review sheet must separate from the reading surface. Default content relies on 1px hairlines, not floating cards.</p></section></main></body></html>
